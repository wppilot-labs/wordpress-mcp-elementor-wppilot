name: Quality

# Three gates, all of which used to be things a person had to remember.
#
# `lint` parses every source file under each PHP version the plugin claims to
# support. The header says 8.0, but development happens on 8.3, so syntax that
# only parses on a newer runtime is the failure this catches — and it fatals on
# activation rather than reporting an error anyone can read.
#
# `docs` runs the consistency checker against .github/product-facts.json, so a
# number that changes in one table cannot stay wrong in the next one.
#
# `package` runs the real release script. The script already refuses to seal an
# archive containing a file that does not parse; this makes that gate run on
# every push instead of only on the machine that happens to cut the release.
#
# `phpunit` runs the unit suite and the regression smoke test, which until now
# only ran on whichever machine had a scratch copy with the dev tools in it.
#
# `kits` holds the portable feature kits in includes/kits to the promise that
# they can be copied into another plugin: the boundary lint, an export, and the
# coexistence test that loads WPPilot's copy and the exported one side by side.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The shipped tree is what the header's PHP requirement is a promise
      # about. tests/ and scripts/ never reach a user's server — package.sh
      # excludes both — and the test suite already needs 8.2 for PHPUnit 11, so
      # holding them to 8.0 would fail on syntax nobody will ever run there.
      - name: Parse the shipped tree
        run: |
          failed=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file" || true
              failed=1
            fi
          done < <(find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './build/*' \
            -not -path './tests/*' \
            -not -path './scripts/*' \
            -not -path './src/*')
          exit "$failed"

      - name: Parse the development-only tree
        if: matrix.php == '8.3'
        run: |
          failed=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file" || true
              failed=1
            fi
          done < <(find ./tests ./scripts -name '*.php')
          exit "$failed"

      - name: Validate composer.json
        run: composer validate --no-check-lock --no-check-publish

  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: php scripts/check-doc-consistency.php

      # The documents are held to product-facts.json; this holds product-facts.json
      # to the code, so a new ability cannot leave every document one short.
      - run: php scripts/check-ability-count.php

      # A duplicate function declaration is a fatal on activation and nothing
      # else here can see it: php -l parses one file at a time, and the unit
      # suite loads only the modules it exercises.
      - run: php scripts/check-duplicate-declarations.php

  package:
    name: Release archive builds
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build wppilot.zip
        run: ./scripts/package.sh

      - name: Check the archive root is wppilot/
        run: |
          set -euo pipefail
          root="$(unzip -Z1 build/wppilot.zip | head -1 | cut -d/ -f1)"
          test "$root" = "wppilot" || { echo "Archive root is '$root', expected 'wppilot'"; exit 1; }
          unzip -Z1 build/wppilot.zip | grep -q '^wppilot/wppilot.php$'
          unzip -Z1 build/wppilot.zip | grep -q '^wppilot/vendor/'

      - uses: actions/upload-artifact@v4
        with:
          name: wppilot-zip
          path: build/wppilot.zip
          if-no-files-found: error

  phpunit:
    name: PHPUnit on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 11 needs 8.2; the 8.0 promise is kept by `lint` and `kits`.
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # vendor/ is tracked, and production-only, because it ships in the release
      # archive. The dev tools are installed over it in this runner's checkout
      # and nowhere else: nothing in this job commits or uploads vendor/.
      # dump-autoload --dev is not redundant: jetpack-autoloader's install-time
      # dump leaves PHPUnit's own classes out of the classmap.
      - name: Install development dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer dump-autoload --dev

      - run: vendor/bin/phpunit --no-coverage

      - run: php tests/regression-smoke.php

  kits:
    name: Kits on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.0 is the oldest runtime a kit promises. The coexistence test executes
        # the runtime and every kit, so running it there catches an 8.1 library
        # call that parses fine and fatals only when reached.
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Kit boundary lint
        run: php scripts/check-kit-boundaries.php

      - name: Parse includes/kits
        run: |
          failed=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null 2>&1 || { php -l "$file" || true; failed=1; }
          done < <(find includes/kits -name '*.php')
          exit "$failed"

      # The exporter lints every file it emits with this same PHP, and refuses
      # leftovers, clashing declarations and over-long names.
      - name: Export a kit twice, byte-identically
        run: |
          set -euo pipefail
          for run in 1 2; do
            php scripts/export-kit.php --kits=changes-export --namespace='KitDemo\Kits' \
              --prefix=kitdemo --text-domain=kit-demo --out="$RUNNER_TEMP/export-$run/kits"
          done
          diff -r "$RUNNER_TEMP/export-1" "$RUNNER_TEMP/export-2"

      - name: Kit coexistence with an exported copy
        run: php scripts/test-kit-coexistence.php
