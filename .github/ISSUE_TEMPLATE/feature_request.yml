name: Feature request
description: Suggest an ability or capability for the free WordPress MCP server
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the implementation. What an agent should be able to accomplish.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How do you do it today
      description: Manually, with another plugin, or not at all.
  - type: markdown
    attributes:
      value: |
        Elementor editing is part of this free plugin, so Elementor ability
        requests belong here. The other page-builder and plugin-aware
        integrations (Bricks, Divi, Oxygen, Beaver Builder, Breakdance, Etch,
        WPBakery, WooCommerce, ACF and the rest) live in WPPilot Pro rather than
        here — suggest those at <https://wppilot.co/support/contact>, or use the
        integration request template.
